name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build + unit tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild Sudoku.sln -p:Configuration=Release -p:Platform=x64 -m

      - name: Run unit tests
        run: bin\Release\SudokuTests.exe
