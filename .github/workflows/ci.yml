name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  logic-and-tests:
    name: Logic + unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DSUDOKU_BUILD_GUI=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Run unit tests
        run: ctest --test-dir build --build-config Release --output-on-failure

  gui:
    name: GUI build (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DSUDOKU_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release --parallel
